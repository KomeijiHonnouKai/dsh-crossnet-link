# dsh-crossnet-link - continuous integration
#
# LAST UPDATED  : 2026-09-24 (task t39 - the enumerated default scope below gained tools/,
#                 so the uninstaller is gate-covered too; t24 noted the whole-release-set scope)
# COMMANDS USED : python .github/scripts/check-workflows.py --selftest
#                 powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/repo-hygiene.ps1 -SelfTest
#                 powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1
#
# Every runner is windows-latest because every script in this repository targets Windows
# PowerShell 5.1 - the runtime that ships with Windows 10 and Windows 11. PowerShell 7 is
# neither required nor claimed.
#
# The hygiene gate is intentionally strict: 0 hits for blocked identifiers, private ranges,
# node suffixes, credential value shapes and unclassified tokens. A residual real identifier
# fails the build instead of being waved through; everything the gate does not treat as
# blocking is classified by token or by kind and printed in its report (README.md section 10).
#
# No scan-root argument is passed on purpose: the gate's default roots ARE the release set
# (src/, i18n/, tests/, panel/, tools/, docs/collect.md, docs/install/, docs/threat-model.md,
# SECURITY.md, the root files and .github/**), so a published file cannot escape the gate by
# living in a directory somebody forgot to list.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: repository hygiene and workflow gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Release-set hygiene gate (identifiers, credentials, encodings, binaries)
        shell: powershell
        run: |
          .\.github\scripts\repo-hygiene.ps1 -Json

      - name: Hygiene gate self-test (positive and negative controls)
        shell: powershell
        run: |
          .\.github\scripts\repo-hygiene.ps1 -SelfTest

      - name: Workflow YAML parse and schema gate
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.2"
          python .github/scripts/check-workflows.py --require-pyyaml

  test:
    name: test suite (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Run the cross-environment and fault-injection suite
        shell: powershell
        run: |
          # The suite is launched as a CHILD process (-File), so its own `exit N` cannot
          # terminate this wrapper before the failure lines have been turned into annotations.
          # On failure the FAILURES detail block goes into ::error annotations FIRST: GitHub
          # keeps at most 10 annotations per step, and that block is the only place that
          # carries the expected/actual fields per failing case.
          $lines = @(& powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 2>&1 | ForEach-Object { $_.ToString() })
          $code = $LASTEXITCODE
          foreach ($l in $lines) { Write-Host $l }
          if ($null -eq $code) { $code = 1 }
          if ($code -ne 0) {
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^FAILURES:') { $start = $i; break } }
            if ($start -ge 0) {
              foreach ($l in @($lines[$start..($lines.Count - 1)] | Select-Object -First 10)) { Write-Host ('::error title=suite-failures::' + $l.Trim()) }
            } else {
              foreach ($l in @($lines | Select-Object -Last 10)) { Write-Host ('::error title=suite-tail::' + $l.Trim()) }
            }
          }
          exit $code

      - name: Simulated clean host (no Tailscale, no DSH on the runner)
        shell: powershell
        run: |
          # Regression guard for a defect CI itself found: the collector resolves a tool by
          # looking on the REAL machine unless the fixture declares `tools.<name>`
          # (src/collect.ps1:937-966), and -NoNative does NOT gate that layer. A case that
          # forgets to pin its tool therefore passes on a machine that happens to have it and
          # fails on a clean one. -SimulateCleanHost plays that clean machine here.
          $lines = @(& powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -SimulateCleanHost 2>&1 | ForEach-Object { $_.ToString() })
          $code = $LASTEXITCODE
          foreach ($l in $lines) { Write-Host $l }
          if ($null -eq $code) { $code = 1 }
          if ($code -ne 0) {
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^FAILURES:') { $start = $i; break } }
            if ($start -ge 0) {
              foreach ($l in @($lines[$start..($lines.Count - 1)] | Select-Object -First 10)) { Write-Host ('::error title=clean-host-failures::' + $l.Trim()) }
            } else {
              foreach ($l in @($lines | Select-Object -Last 10)) { Write-Host ('::error title=clean-host-tail::' + $l.Trim()) }
            }
          }
          exit $code

      - name: Static analysis (PSScriptAnalyzer, pinned version)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Scope CurrentUser -Force
          $errors = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($errors.Count -gt 0) {
            $errors | Format-Table -AutoSize | Out-String -Width 220 | Write-Host
            throw ('PSScriptAnalyzer reported ' + $errors.Count + ' error-severity finding(s)')
          }
          Write-Host 'PSScriptAnalyzer: 0 error-severity findings'
          $warnings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning)
          Write-Host ('PSScriptAnalyzer warning-severity findings (informational, they do not fail the build): ' + $warnings.Count)
          if ($warnings.Count -gt 0) {
            $warnings | Select-Object -First 40 | Format-Table -AutoSize | Out-String -Width 220 | Write-Host
          }
